; EXAMPLE ONLY: generic classic ESP32, not a confirmed physical board.
; Without a confirmed private pin configuration the firmware will NOT drive GPIO.
[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
lib_deps =
    https://github.com/ZinggJM/GxEPD2.git#de82887e77a78528ea386e68bba2cb0291d2c319
    adafruit/Adafruit GFX Library@1.12.6
