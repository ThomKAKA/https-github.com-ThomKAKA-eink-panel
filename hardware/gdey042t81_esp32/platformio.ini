; EXAMPLE ONLY: generic classic ESP32, not a confirmed physical board.
; Without a confirmed private pin configuration the firmware will NOT drive GPIO.
[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
lib_deps =
    https://github.com/ZinggJM/GxEPD2.git#de82887e77a78528ea386e68bba2cb0291d2c319
    adafruit/Adafruit GFX Library@1.12.6

; Vendor manual selects WEMOS LOLIN32. This is a compile-only board mapping.
; The tracked ESP32-M1 configuration does not authorize physical GPIO activity.
[env:esp32-m1]
extends = env:esp32dev
board = lolin32
build_flags =
    ${env:esp32dev.build_flags}
    -DEINK_BOARD_ESP32_M1=1

; Dedicated one-shot H1 test; private configuration is required, never inherited
; by the guarded default environments. No upload is performed by a build.
[env:esp32-m1-h1]
extends = env:esp32-m1
build_src_filter = -<*> +<h1/main.cpp>
build_flags =
    ${env:esp32-m1.build_flags}
    -DEINK_H1_ATOMIC_TEST=1
    -I.build/h1-private

; Separate Progress input; the frozen H1 entry/environment remains unchanged.
[env:esp32-m1-progress]
extends = env:esp32-m1
build_src_filter = -<*> +<progress/main.cpp>
build_flags =
    ${env:esp32-m1.build_flags}
    -DEINK_H1_ATOMIC_TEST=1
    -DEINK_PROGRESS_EMBEDDED_TEST=1
    -I.build/progress-private

; STEP017 dedicated entry; private headers are never supplied by default profiles.
[env:esp32-m1-network-progress]
extends = env:esp32-m1
build_src_filter = -<*> +<network_progress/main.cpp>
build_flags =
    ${env:esp32-m1.build_flags}
    -DEINK_H1_ATOMIC_TEST=1
    -DEINK_NETWORK_PROGRESS=1
    -I.build/network-progress-private
